# =============================================================================
# stack-spiderfoot-docker.yml — reference Docker deployment, builds from source
# Version: 1.11.0
# Created: 2026-09-10
# Updated: 2026-09-22
#
# Published from this fork's own private dev/repro stack of the same name -
# history below predates publication and references stack-spiderfoot-
# podman.yml, the maintainer's own production Podman deployment - also
# published here now, at the repo root alongside this file. It's the
# source of truth for application-level config (LLM routing, model names,
# env var meanings) that this file mirrors.
#
# Summary:
#   Purpose:
#     Builds every image from source and runs the full stack locally via
#     plain `docker compose` - no Traefik, no profiles, one flat file. See
#     docker-compose.yml (+ docker/compose/*.yml) for the profile-gated
#     reference deployment instead, or stack-spiderfoot-podman.yml for the
#     production Podman deployment (pulls this fork's own pre-built images
#     rather than building anything, and is genuinely Podman-compatible -
#     standard Compose syntax throughout).
#     This file is NOT derived by copying the maintainer's own podman
#     deployment's service list - the shapes differ on purpose:
#       - podman/prod has no MinIO/Tika at all (and had no Qdrant either,
#         until 1.12.0 - the actual root cause behind reports staying thin
#         in prod after the fork's fixes shipped: nothing there to point
#         SF_QDRANT_HOST at); this stack still carries MinIO/Tika, since
#         reproducing and fixing the AI-report-generation bugs this
#         environment exists for benefits from the fuller storage stack
#         (see the fork's own commit history for the nine bugs found and
#         fixed here before being ported to prod).
#       - podman pulls prebuilt GHCR images (ghcr.io/braedach/spiderfoot/
#         spiderfoot-<service>); this stack builds directly from source
#         (build.context: . / ./frontend below).
#       - podman bind-mounts host paths; this stack uses named Docker
#         volumes instead, so it runs anywhere with no host setup beyond
#         cloning the repo.
#     What IS carried over from podman, and must stay in sync going
#     forward: the Anthropic-via-LiteLLM routing (spiderfoot-llm /
#     gemma3-27b aliases), the litellm healthcheck, the scanner/
#     active-scanner queue split (see Changelog 1.6.0 — this file
#     silently broke that split for two revisions), and the Qdrant/
#     embeddings wiring on agents.
#
#     110 of SpiderFoot's 310 modules need an API key; 80 of those are
#     free (sign up, generate a key, add via the UI's module settings -
#     a separate layer from this file/env entirely). Highest-value free
#     ones: Shodan, VirusTotal, SecurityTrails, AlienVault OTX, Censys,
#     BinaryEdge, Hunter.io, AbuseIPDB, IPInfo.io, WhoisXML API,
#     CertSpotter, FullHunt. Full list: docs/free-api-modules.md
#
#   Builds:
#     development branch commit 4b0231b2 is NOT good - do not use. Real
#     Postgres connection-leak bug in ReportStore's read-only methods (see
#     stack-spiderfoot-podman.yml's Changelog 2.4.0 for the full incident -
#     same shared source, same bug, both platforms) - causes AI report
#     generation to appear to hang/spin after a few uses.
#     6.1.0-gb05e98c3 is NOT good - do not use. Despite its own changelog
#     claiming otherwise, that fix never actually shipped in code, only in
#     docs (see Changelog 1.11.0). 6.1.0-g95d573f9 is the new known-good
#     build (2026-09-22) - fixes the above for real this time, plus the
#     same missing-commit pattern found and fixed across 17 more
#     spiderfoot/db/ methods. Verified live via direct stress-test.
#
#     Images pull CPU-only torch (fork requirements.txt, verified
#     2026-09-11) - base/api/scanner 6.71GB -> 1.97GB, active-scanner
#     9.04GB -> 4.3GB. A plain `pip install torch` resolves to the CUDA
#     build by default, which pulls in the full nvidia/* runtime + triton
#     (~5.3GB) regardless of whether a GPU exists - it doesn't here,
#     all-MiniLM-L6-v2 runs on CPU. No GPU anywhere in this deployment.
#
#   Usage:
#     git clone https://github.com/braedach/spiderfoot.git && cd spiderfoot
#     cp stack-spiderfoot-docker.env.example stack-spiderfoot-docker.env
#     # edit stack-spiderfoot-docker.env: set real secrets, and ANTHROPIC_API_KEY
#     # if you want real AI reports rather than the mock LLM provider default.
#     #
#     # agents builds the shared base image and tags it explicitly as
#     # spiderfoot-docker-base:latest - build it FIRST, deliberately, not
#     # left to compose's own build ordering (see Changelog 1.7.0 for why
#     # this must not be skipped or assumed):
#     docker compose -f stack-spiderfoot-docker.yml --env-file stack-spiderfoot-docker.env build agents
#     docker compose -f stack-spiderfoot-docker.yml --env-file stack-spiderfoot-docker.env up -d --build
#
#   Prerequisites:
#     - docker + docker compose v2 on the host
#     - Enough disk for a from-source build, not just the final images -
#       significantly more headroom than a pull-based deploy needs
#       (build cache + intermediate layers on top of final image sizes).
#
#   Warnings:
#     - BREAKING CHANGE (1.8.0, 2026-09-16): qdrant jumped v1.12.4 -> v1.19.1,
#       a 7-minor-version bump. If you already have a running deployment
#       of this file with real data in ./volume/qdrant, do not just bump
#       the tag and restart in place - Qdrant's own upgrade docs are
#       explicit that a single-node deployment cannot skip minor versions
#       with existing data on disk, and stack-spiderfoot-podman.yml hit
#       this for real (see its own 2.3.0 changelog entry: immediate
#       crash-loop, RocksDB->Gridstore storage format incompatibility).
#       Since nothing this stack stores in Qdrant is anything other than
#       a reconstructable derivative of Postgres scan data (confirmed by
#       tracing every write path, 2026-09-16), the fix there was to stop
#       qdrant, wipe its volume entirely, and start clean on the new
#       version rather than step through every intermediate release -
#       the same applies here if you're not starting fresh.
#     - depends_on is start-order only, not health-gated except where a
#       service explicitly declares `condition: service_healthy` above -
#       check each one rather than assuming.
#     - read_only + tmpfs mode=1777 on the api/worker containers and
#       nginx's tmpfs + cap_add [CHOWN, SETUID, SETGID] on the frontend
#       were both found the hard way on the podman side - kept here too.
#     - Runs 300+ modules incl. 33+ active recon tools (celery-worker-active)
#       that make outbound requests to third parties during scans - only
#       scan targets you are authorised to investigate. IDS/IPS systems
#       may go ballistic.
#
# Changelog:
#   1.11.0 (2026-09-22) - New known-good build: 6.1.0-g95d573f9. Same
#     incident, same fixes, same verification as stack-spiderfoot-podman.yml's
#     identical 2.6.0 entry - not repeated here. See PR #393.
#   1.10.0 (2026-09-18) - Two real scan-engine bugs found and fixed, not a
#     new known-good build (still 6.1.0-gb05e98c3 below - not bumping that
#     yet, giving it more soak time). Same source, same fixes, same
#     verification as stack-spiderfoot-podman.yml's identical 2.5.0 entry -
#     not repeated here. Image tag 6.1.0-gfeede62f. See PR #393.
#   1.9.0 (2026-09-17) - New known-good build: commit b05e98c3 (image tag
#     6.1.0-gb05e98c3). 4b0231b2 (1.7.0's known-good build) has a real Postgres
#     connection-leak bug - see stack-spiderfoot-podman.yml's Changelog
#     2.4.0 for the full incident and verification detail (same shared
#     source, same bug, same fix, both platforms - not repeated here).
#     Also added SF_REPORT_MAX_EVENTS_PER_SCAN=2000 to agents - unset here
#     too, same fix as stack-spiderfoot-podman.yml's identical addition.
#   1.8.0 (2026-09-16) - BREAKING CHANGE: qdrant v1.12.4 -> v1.19.1, kept
#     in sync with stack-spiderfoot-podman.yml's identical bump (see its
#     2.3.0 changelog entry for the full incident and verification detail
#     - not repeated here). See the Warnings entry above for what this
#     means if you're upgrading an existing deployment rather than
#     starting fresh.
#   1.7.0 (2026-09-13) - Found by testing actually catching it, not by
#     anything failing loudly - the single most important reason to
#     re-verify after any fix to this file rather than trust a clean
#     `up -d --build` on its own:
#     - api, celery-worker, and celery-worker-active's Dockerfiles
#       (Dockerfile.api/.scanner/.active-scanner) each default to
#       ARG BASE_IMAGE=spiderfoot-base:latest - a generic, unqualified
#       name. agents (built from Dockerfile.base directly) was tagged
#       with compose's own default name, never touching that literal
#       tag - so all three silently resolved BASE_IMAGE to whatever
#       pre-existing local "spiderfoot-base:latest" image happened to
#       exist, which on this box was a 10-day-stale image from unrelated
#       earlier work. Result: api/celery-worker/celery-worker-active ran
#       10-day-old application code - missing this session's report-
#       persistence, PDF-dispatch, and workspace fixes entirely - while
#       reporting fully healthy and building without a single error or
#       warning. Caught only because a delete-parity test against the
#       live api container raised TypeError for a parameter that should
#       have existed. Fixed by explicitly tagging agents' build as
#       spiderfoot-docker-base:latest (image:, not left to compose's
#       default) and pointing the other three at that exact tag via
#       build.args.BASE_IMAGE - project-prefixed so it can't collide
#       with an unrelated "spiderfoot-base" tag again. Usage above now
#       says to build agents first, explicitly, rather than rely on
#       compose's own build ordering.
#     - frontend crash-looped on first-ever deploy of this file:
#       nginx: [emerg] host not found in resolver "${NGINX_LOCAL_RESOLVERS}".
#       Same root cause already fixed on the fork/podman side (the
#       official nginx image only auto-derives NGINX_LOCAL_RESOLVERS
#       from this container's own /etc/resolv.conf when
#       NGINX_ENTRYPOINT_LOCAL_RESOLVERS is set) - this file just never
#       set the toggle at all. stack-spiderfoot-podman.yml already had
#       it. Added.
#   1.6.0 (2026-09-13) - Found during a side-by-side audit against
#     stack-spiderfoot-podman.yml, before this was ever deployed anywhere -
#     fixed here instead of finding out after:
#     - celery-worker-active was missing entirely. Worse than just missing:
#       celery-worker's command overrode its own image's correct baked-in
#       queue list (Dockerfile.scanner: --queues=default,report,export,
#       agents,monitor) by adding "scan" to it - meaning any active-recon
#       task routed to the scan queue would have landed on the passive
#       image, which doesn't carry the active-recon tooling
#       (Dockerfile.active-scanner does, separately, hence the 4.3GB vs
#       ~2GB size difference). Fixed by adding celery-worker-active
#       (built from Dockerfile.active-scanner) and removing celery-worker's
#       command/entrypoint override entirely so each image's own correct
#       default applies - matches podman's approach of never overriding
#       these for either worker.
#     - SF_EMBEDDING_PROVIDER/MODEL/DIMENSIONS and SF_QDRANT_BACKEND were
#       set as env-var fallback defaults (${VAR:-mock}, ${VAR:-memory},
#       ${VAR:-1536}) rather than hardcoded - the exact silent-degradation
#       bug class stack-spiderfoot-podman.yml's own 2.1.0 changelog entry
#       describes fixing (mock/fake embeddings, ephemeral Qdrant), left
#       one env-file edit away from recurring here. Hardcoded to match
#       podman's no-unsafe-fallback approach.
#     - The EventBus/Qdrant real-time-indexing inline comments on
#       celery-worker and agents described it in the present tense as if
#       live ("publishes... as it's produced", "runs the one long-lived
#       EventIndexer") - contradicting this file's own 1.4.0 changelog
#       entry, which correctly says it was reverted on the fork side and
#       is inert. Reworded to match podman's "CURRENTLY INERT" phrasing
#       and this file's own changelog.
#     - This header itself didn't have podman's Summary/Warnings/
#       Prerequisites structure - added, including podman's Warnings
#       content (equally applicable here, previously absent).
#   1.5.0 (2026-09-11) - No config change here, just a note: two Postgres
#     connection leaks were found and fixed on the fork side (commits
#     1a6f446e, d4e2b6c2 - ConfigManager.configGet/scanConfigGet and most
#     of AuthService, both reads that never committed) - applies to this
#     stack too on next build, since it builds straight from ./src. See
#     stack-spiderfoot-podman.yml's Builds note for the full story.
#   1.4.0 (2026-09-11) - The real-time EventBus/Qdrant indexing this stack's
#     SF_EVENTBUS_BACKEND/SF_EVENTBUS_REDIS_URL (1.2.0) wired up was reverted
#     on the fork side (commit f75ce847, see stack-spiderfoot-podman.yml's
#     Builds note for why) - these two env vars are now inert, nothing in
#     the deployed app code reads them. Left in place rather than removed,
#     ready for whenever that feature gets a clean verification pass.
#   1.3.0 (2026-09-11) - Noted the fork's CPU-only torch fix (requirements.txt,
#     commit a55f49b5) in the module-key note below - base/api/scanner images
#     verified 6.71GB -> 1.97GB, active-scanner 9.04GB -> 4.3GB, by no longer
#     pulling in ~5.3GB of unused nvidia/CUDA + triton that plain `pip install
#     torch` resolves to by default. No GPU anywhere in this deployment.
#   1.2.0 (2026-09-11) - Added SF_EVENTBUS_BACKEND/SF_EVENTBUS_REDIS_URL to
#     celery-worker and agents - wires the real-time EventIndexer(Qdrant),
#     previously complete code nothing ever started (the Postgres backfill
#     in report_generator.py stays as a safety net, not replaced)
#   1.1.0 (2026-09-10) - Noted podman's sf-qdrant addition (1.12.0) in the
#     comparison above; summary now notes 110/310 modules need an API
#     key, 80 free - see docs/free-api-modules.md
#   1.0.0 (2026-09-10) - Recreated after being deleted directly on main
#     (commit d40d6ee); see the note below for why.
#
# Previously named stack-spiderfoot-dev.yml; deleted directly on main
# (commit d40d6ee) and recreated under this name for symmetry with
# stack-spiderfoot-podman.yml - "-dev" vs "-podman" didn't read as a
# matched pair the way "-docker" vs "-podman" does.
# =============================================================================

name: spiderfoot-docker

services:
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: spiderfoot-docker-redis
    hostname: redis
    restart: unless-stopped
    user: "999:999"
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    networks:
      - spiderfoot-docker-net
    command: >
      redis-server
        --appendonly yes
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: spiderfoot-docker-postgres
    hostname: postgres
    restart: unless-stopped
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - FOWNER
    tmpfs:
      - /tmp:noexec,nosuid,size=64M
      - /run/postgresql:noexec,nosuid,size=8M
    networks:
      - spiderfoot-docker-net
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spiderfoot}
      POSTGRES_USER: ${POSTGRES_USER:-spiderfoot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "max_connections=500"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spiderfoot"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      args:
        # Explicit, not the Dockerfile's own ARG BASE_IMAGE=spiderfoot-base:latest
        # default (1.6.0 fix) - that generic name silently resolved to whatever
        # pre-existing local "spiderfoot-base:latest" tag happened to exist,
        # including a 10-day-stale one from unrelated earlier work on this
        # machine, baking old application code into api/celery-worker/
        # celery-worker-active with a fully successful, cache-hit build and
        # zero errors - found only by testing actually catching the stale
        # code, not by anything failing loudly. spiderfoot-docker-base is
        # project-prefixed specifically so it can never collide with an
        # unrelated local "spiderfoot-base" tag again.
        BASE_IMAGE: spiderfoot-docker-base:latest
    container_name: spiderfoot-docker-api
    hostname: api
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256M,mode=1777
      - /home/spiderfoot/logs:size=64M,mode=1777
      - /home/spiderfoot/data:size=128M,mode=1777
      - /home/spiderfoot/cache:size=64M,mode=1777
      - /home/spiderfoot/.spiderfoot:size=32M,mode=1777
    networks:
      - spiderfoot-docker-net
    environment:
      SF_SERVICE_ROLE: api
      SF_DEPLOYMENT_MODE: microservice
      SF_EXTERNAL_URL: "${SF_EXTERNAL_URL:-http://localhost:8090}"
      SF_REDIS_URL: redis://redis:6379/0
      SF_POSTGRES_DSN: postgresql://${POSTGRES_USER:-spiderfoot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-spiderfoot}
      SF_API_HOST: "0.0.0.0"
      SF_API_PORT: "8001"
      SF_API_WORKERS: ${SF_API_WORKERS:-2}
      SF_LOG_LEVEL: ${SF_LOG_LEVEL:-INFO}
      SF_API_KEY: ${SF_API_KEY:-}
      SF_TIKA_URL: "http://tika:9998"
      # Hardcoded, no unsafe fallback (1.6.0) - see celery-worker/agents
      # below for the full story on why these three specifically are
      # pinned rather than left as ${VAR:-...} fallbacks.
      SF_QDRANT_BACKEND: http
      SF_QDRANT_HOST: "${SF_QDRANT_HOST:-qdrant}"
      SF_QDRANT_PORT: "${SF_QDRANT_PORT:-6333}"
      SF_QDRANT_GRPC_PORT: "${SF_QDRANT_GRPC_PORT:-6334}"
      SF_QDRANT_PREFIX: "${SF_QDRANT_PREFIX:-sf_}"
      SF_EMBEDDING_PROVIDER: fastembed
      SF_EMBEDDING_MODEL: all-MiniLM-L6-v2
      SF_EMBEDDING_DIMENSIONS: 384
      SF_EMBEDDING_API_KEY: ${SF_LLM_API_KEY:-}
      SF_EMBEDDING_API_BASE: ${SF_EMBEDDING_API_BASE:-}
      SF_RERANKER_PROVIDER: ${SF_RERANKER_PROVIDER:-mock}
      SF_RERANKER_MODEL: ${SF_RERANKER_MODEL:-}
      SF_RERANKER_API_KEY: ${SF_LLM_API_KEY:-}
      SF_RERANKER_API_BASE: ${SF_RERANKER_API_BASE:-}
      SF_RERANKER_TOP_K: ${SF_RERANKER_TOP_K:-10}
      SF_RERANKER_SCORE_THRESHOLD: ${SF_RERANKER_SCORE_THRESHOLD:-0.3}
      SF_LLM_PROVIDER: ${SF_LLM_PROVIDER:-mock}
      SF_LLM_MODEL: ${SF_LLM_MODEL:-}
      SF_LLM_API_KEY: ${SF_LLM_API_KEY:-}
      SF_LLM_API_BASE: ${SF_LLM_API_BASE:-}
      SF_VECTOR_CORRELATION_ENABLED: ${SF_VECTOR_CORRELATION_ENABLED:-false}
      SF_VECTOR_SIMILARITY_THRESHOLD: ${SF_VECTOR_SIMILARITY_THRESHOLD:-0.7}
      SF_VECTOR_CROSS_SCAN_THRESHOLD: ${SF_VECTOR_CROSS_SCAN_THRESHOLD:-0.8}
      SF_VECTOR_RERANK_ACCURACY: ${SF_VECTOR_RERANK_ACCURACY:-high}
      SF_MINIO_ENDPOINT: "http://minio:9000"
      SF_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-}
      SF_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
      SF_MINIO_SECURE: "false"
      SF_MINIO_REPORTS_BUCKET: ${SF_MINIO_REPORTS_BUCKET:-sf-reports}
      SF_MINIO_DATA_BUCKET: ${SF_MINIO_DATA_BUCKET:-sf-data}
      SF_MINIO_LOGS_BUCKET: ${SF_MINIO_LOGS_BUCKET:-sf-logs}
      SF_JWT_SECRET: ${SF_JWT_SECRET}
      SF_JWT_EXPIRY_HOURS: ${SF_JWT_EXPIRY_HOURS:-24}
      SF_JWT_REFRESH_EXPIRY_HOURS: ${SF_JWT_REFRESH_EXPIRY_HOURS:-168}
      SF_AUTH_REQUIRED: ${SF_AUTH_REQUIRED:-true}
      SF_RBAC_ENFORCE: ${SF_RBAC_ENFORCE:-true}
      SF_ADMIN_USERNAME: ${SF_ADMIN_USERNAME:-admin}
      SF_ADMIN_PASSWORD: ${SF_ADMIN_PASSWORD}
      SF_ADMIN_EMAIL: ${SF_ADMIN_EMAIL:-admin@spiderfoot.local}
      SF_MAX_LOGIN_ATTEMPTS: ${SF_MAX_LOGIN_ATTEMPTS:-5}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    command: ["python", "-m", "spiderfoot.service_runner", "--service", "api", "--port", "8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/docs')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-1.0}"
          memory: "${API_MEMORY:-1G}"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spiderfoot-docker-frontend
    hostname: frontend
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
      - /etc/nginx/conf.d
      - /var/log/nginx
    networks:
      - spiderfoot-docker-net
    ports:
      - "8090:80"
    environment:
      SF_API_URL: "http://api:8001"
      SF_WS_URL: "http://api:8001"
      SF_AGENTS_URL: "http://agents:8100"
      # Found 2026-09-13, live crash-loop on first deploy of this file:
      # frontend/nginx.conf's resolver line reads ${NGINX_LOCAL_RESOLVERS} -
      # the official nginx image only auto-derives that (from this
      # container's own /etc/resolv.conf) when this toggle is set; unset,
      # the auto-detect script no-ops entirely and the placeholder is left
      # unexpanded, crashing nginx with "host not found in resolver". Same
      # variable/mechanism stack-spiderfoot-podman.yml already sets.
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: 1
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "${WEBUI_CPUS:-0.5}"
          memory: "${WEBUI_MEMORY:-256M}"

  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.scanner
      args:
        # See api's identical note above (1.6.0 fix).
        BASE_IMAGE: spiderfoot-docker-base:latest
    container_name: spiderfoot-docker-celery-worker
    hostname: celery-worker
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256M,mode=1777
      - /home/spiderfoot/logs:size=64M,mode=1777
      - /home/spiderfoot/data:size=128M,mode=1777
      - /home/spiderfoot/cache:size=64M,mode=1777
      - /home/spiderfoot/.spiderfoot:size=32M,mode=1777
    networks:
      - spiderfoot-docker-net
    environment:
      SF_SERVICE_ROLE: scanner
      SF_REDIS_URL: redis://redis:6379/0
      # Real-time Qdrant indexing via EventBus - CURRENTLY INERT. Reverted
      # on the fork side (commit f75ce847, see stack-spiderfoot-podman.yml's
      # Builds note for why) - nothing in the deployed app code reads these
      # two vars. Left in place, not removed, for whenever that feature
      # gets a clean, unhurried verification pass and goes back in.
      SF_EVENTBUS_BACKEND: redis
      SF_EVENTBUS_REDIS_URL: redis://redis:6379/0
      SF_POSTGRES_DSN: postgresql://${POSTGRES_USER:-spiderfoot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-spiderfoot}
      SF_LOG_LEVEL: ${SF_LOG_LEVEL:-INFO}
      SF_TIKA_URL: "http://tika:9998"
      SF_MINIO_ENDPOINT: "http://minio:9000"
      SF_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-}
      SF_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
      SF_MINIO_SECURE: "false"
      SF_MINIO_REPORTS_BUCKET: ${SF_MINIO_REPORTS_BUCKET:-sf-reports}
      SF_MINIO_DATA_BUCKET: ${SF_MINIO_DATA_BUCKET:-sf-data}
      SF_LLM_PROVIDER: ${SF_LLM_PROVIDER:-mock}
      SF_LLM_API_BASE: ${SF_LLM_API_BASE:-}
      SF_LLM_API_KEY: ${SF_LLM_API_KEY:-}
      SF_LLM_MODEL: ${SF_LLM_MODEL:-}
      # Hardcoded, no unsafe fallback (1.6.0) - matches
      # stack-spiderfoot-podman.yml. ${VAR:-memory}/${VAR:-mock}/
      # ${VAR:-1536} previously sat here as the *fallback* defaults; one
      # missing env-file line away from silently reproducing the exact
      # ephemeral-Qdrant/mock-embeddings bug podman's 2.1.0 changelog
      # describes fixing. Qdrant host/port/prefix stay env-configurable -
      # only the values with unsafe-default history are pinned.
      SF_QDRANT_BACKEND: http
      SF_QDRANT_HOST: "${SF_QDRANT_HOST:-qdrant}"
      SF_QDRANT_PORT: "${SF_QDRANT_PORT:-6333}"
      SF_QDRANT_GRPC_PORT: "${SF_QDRANT_GRPC_PORT:-6334}"
      SF_QDRANT_PREFIX: "${SF_QDRANT_PREFIX:-sf_}"
      SF_EMBEDDING_PROVIDER: fastembed
      SF_EMBEDDING_MODEL: all-MiniLM-L6-v2
      SF_EMBEDDING_DIMENSIONS: 384
      SF_EMBEDDING_API_KEY: ${SF_LLM_API_KEY:-}
      SF_EMBEDDING_API_BASE: ${SF_EMBEDDING_API_BASE:-}
      SF_RERANKER_PROVIDER: ${SF_RERANKER_PROVIDER:-mock}
      SF_RERANKER_MODEL: ${SF_RERANKER_MODEL:-}
      SF_RERANKER_API_KEY: ${SF_LLM_API_KEY:-}
      SF_RERANKER_API_BASE: ${SF_RERANKER_API_BASE:-}
      SF_RERANKER_TOP_K: ${SF_RERANKER_TOP_K:-10}
      SF_VECTOR_CORRELATION_ENABLED: ${SF_VECTOR_CORRELATION_ENABLED:-true}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-4}
    # No entrypoint/command override (1.6.0) - matches podman's
    # sf-celery-worker exactly. This previously overrode the image's own
    # correct baked-in queue list (Dockerfile.scanner:
    # --queues=default,report,export,agents,monitor) by adding "scan" to
    # it - the queue celery-worker-active's image actually carries the
    # active-recon tooling for. Letting the image's own CMD apply removes
    # the drift risk entirely, not just the current symptom.
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "celery", "-A", "spiderfoot.celery_app:celery_app", "inspect", "ping", "--timeout", "5"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${CELERY_WORKER_CPUS:-2.0}"
          memory: "${CELERY_WORKER_MEMORY:-2G}"

  # Added 1.6.0 - was missing entirely (see Changelog). Runs the ~33+
  # active recon modules that make direct outbound connections during a
  # scan - separate image from celery-worker above specifically because
  # of that (see docker/Dockerfile.active-scanner's own header comment).
  celery-worker-active:
    build:
      context: .
      dockerfile: docker/Dockerfile.active-scanner
      args:
        # See api's identical note above (1.6.0 fix).
        BASE_IMAGE: spiderfoot-docker-base:latest
    container_name: spiderfoot-docker-celery-worker-active
    hostname: celery-worker-active
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256M,mode=1777
      - /home/spiderfoot/logs:size=64M,mode=1777
      - /home/spiderfoot/data:size=128M,mode=1777
      - /home/spiderfoot/cache:size=64M,mode=1777
      - /home/spiderfoot/.spiderfoot:size=32M,mode=1777
    networks:
      - spiderfoot-docker-net
    environment:
      SF_SERVICE_ROLE: scanner
      SF_REDIS_URL: redis://redis:6379/0
      # Real-time Qdrant indexing via EventBus - CURRENTLY INERT, same as
      # celery-worker above (reverted 2026-09-11, kept for later).
      SF_EVENTBUS_BACKEND: redis
      SF_EVENTBUS_REDIS_URL: redis://redis:6379/0
      SF_POSTGRES_DSN: postgresql://${POSTGRES_USER:-spiderfoot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-spiderfoot}
      SF_LOG_LEVEL: ${SF_LOG_LEVEL:-INFO}
      SF_TIKA_URL: "http://tika:9998"
      SF_MINIO_ENDPOINT: "http://minio:9000"
      SF_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-}
      SF_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
      SF_MINIO_SECURE: "false"
      SF_MINIO_REPORTS_BUCKET: ${SF_MINIO_REPORTS_BUCKET:-sf-reports}
      SF_MINIO_DATA_BUCKET: ${SF_MINIO_DATA_BUCKET:-sf-data}
      SF_LLM_PROVIDER: ${SF_LLM_PROVIDER:-mock}
      SF_LLM_API_BASE: ${SF_LLM_API_BASE:-}
      SF_LLM_API_KEY: ${SF_LLM_API_KEY:-}
      SF_LLM_MODEL: ${SF_LLM_MODEL:-}
      # Hardcoded, no unsafe fallback - see celery-worker above.
      SF_QDRANT_BACKEND: http
      SF_QDRANT_HOST: "${SF_QDRANT_HOST:-qdrant}"
      SF_QDRANT_PORT: "${SF_QDRANT_PORT:-6333}"
      SF_QDRANT_GRPC_PORT: "${SF_QDRANT_GRPC_PORT:-6334}"
      SF_QDRANT_PREFIX: "${SF_QDRANT_PREFIX:-sf_}"
      SF_EMBEDDING_PROVIDER: fastembed
      SF_EMBEDDING_MODEL: all-MiniLM-L6-v2
      SF_EMBEDDING_DIMENSIONS: 384
      SF_EMBEDDING_API_KEY: ${SF_LLM_API_KEY:-}
      SF_EMBEDDING_API_BASE: ${SF_EMBEDDING_API_BASE:-}
      SF_VECTOR_CORRELATION_ENABLED: ${SF_VECTOR_CORRELATION_ENABLED:-true}
    # No entrypoint/command override - Dockerfile.active-scanner's own
    # CMD (--queues=scan) applies, matching podman's
    # sf-celery-worker-active exactly.
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "celery", "-A", "spiderfoot.celery_app:celery_app", "inspect", "ping", "--timeout", "5"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${CELERY_ACTIVE_WORKER_CPUS:-2.0}"
          memory: "${CELERY_ACTIVE_WORKER_MEMORY:-2G}"

  # ---------------------------------------------------------------------------
  # Storage: MinIO (object storage), Qdrant (vector DB), Tika (doc analysis)
  # Prod (stack-spiderfoot-podman.yml) has none of these - see the header
  # note above for why this stack needs them and prod doesn't.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: spiderfoot-docker-minio
    hostname: minio
    restart: unless-stopped
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nosuid,size=128M
    networks:
      - spiderfoot-docker-net
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "${MINIO_CPUS:-1.0}"
          memory: "${MINIO_MEMORY:-512M}"

  # One-shot bucket initializer. Exits after running - that's expected.
  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-25Z
    container_name: spiderfoot-docker-minio-init
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nosuid,size=32M
    networks:
      - spiderfoot-docker-net
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
        mc --config-dir /tmp alias set sfminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc --config-dir /tmp mb --ignore-existing sfminio/sf-reports;
        mc --config-dir /tmp mb --ignore-existing sfminio/sf-data;
        mc --config-dir /tmp mb --ignore-existing sfminio/sf-logs;
        mc --config-dir /tmp mb --ignore-existing sfminio/sf-qdrant-snapshots;
        echo 'MinIO buckets initialized';
      "

  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: spiderfoot-docker-qdrant
    hostname: qdrant
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    networks:
      - spiderfoot-docker-net
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__SERVICE__HTTP_PORT: "6333"
      # Upstream bug worked around: default /qdrant/snapshots has no
      # writable mount under read_only:true, so it panics on every boot.
      # Repointed under the volume that's already writable.
      QDRANT__STORAGE__SNAPSHOTS_PATH: "/qdrant/storage/snapshots"
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "${QDRANT_CPUS:-1.0}"
          memory: "${QDRANT_MEMORY:-1G}"

  tika:
    image: apache/tika:3.1.0.0-full
    container_name: spiderfoot-docker-tika
    hostname: tika
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    networks:
      - spiderfoot-docker-net
    environment:
      TIKA_SERVER_JAVA_OPTS: "-Xmx${TIKA_HEAP:-512m}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9998/tika || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "${TIKA_CPUS:-1.0}"
          memory: "${TIKA_MEMORY:-1G}"

  # ---------------------------------------------------------------------------
  # AI: LiteLLM proxy (fronts Anthropic Claude Sonnet 5) + Agents service
  # Same LLM backend as stack-spiderfoot-podman.yml - keep these two in
  # sync if the model routing ever changes on either side.
  # ---------------------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: spiderfoot-docker-litellm
    hostname: litellm
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    networks:
      - spiderfoot-docker-net
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "${LITELLM_CPUS:-1.0}"
          memory: "${LITELLM_MEMORY:-512M}"

  agents:
    build:
      context: .
      dockerfile: docker/Dockerfile.base
    # Explicit tag (1.6.0 fix), not compose's own default (spiderfoot-docker-
    # agents:latest) - api/celery-worker/celery-worker-active build FROM this
    # exact tag via their own build.args.BASE_IMAGE, so it must be stable and
    # unambiguous rather than left to whatever a service-name-derived default
    # happens to be. Build this service first (see Usage) so it's actually
    # current before those three build against it.
    image: spiderfoot-docker-base:latest
    container_name: spiderfoot-docker-agents
    hostname: agents
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256M,mode=1777
      - /home/spiderfoot/logs:size=64M,mode=1777
      - /home/spiderfoot/data:size=128M,mode=1777
      - /home/spiderfoot/cache:size=64M,mode=1777
      - /home/spiderfoot/.spiderfoot:size=32M,mode=1777
    volumes:
      # Persists the downloaded sentence-transformers/HuggingFace model
      # (all-MiniLM-L6-v2, ~80MB) across container recreates.
      - embeddings-cache:/home/spiderfoot/.cache/huggingface
    networks:
      - spiderfoot-docker-net
    environment:
      HF_HOME: /home/spiderfoot/.cache/huggingface
      SF_SERVICE_ROLE: agents
      SF_AGENTS_HOST: "0.0.0.0"
      SF_AGENTS_PORT: "8100"
      SF_AGENTS_WORKERS: ${SF_AGENTS_WORKERS:-1}
      SF_LOG_LEVEL: ${SF_LOG_LEVEL:-INFO}
      SF_REDIS_URL: redis://redis:6379/0
      # Real-time Qdrant indexing via EventBus - CURRENTLY INERT. Reverted
      # on the fork side (commit f75ce847, see stack-spiderfoot-podman.yml's
      # Builds note for why) - nothing in the deployed app code reads these
      # two vars. Left in place, not removed, for whenever that feature
      # gets a clean, unhurried verification pass and goes back in - this
      # is also where the indexer itself would run once re-enabled.
      SF_EVENTBUS_BACKEND: redis
      SF_EVENTBUS_REDIS_URL: redis://redis:6379/0
      # Needed so the Qdrant backfill in report_generator.py can read a
      # scan's events via a direct SpiderFootDb - upstream's ai.yml never
      # sets this for the agents service at all.
      SF_POSTGRES_DSN: postgresql://${POSTGRES_USER:-spiderfoot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-spiderfoot}
      SF_LLM_PROVIDER: ${SF_LLM_PROVIDER:-mock}
      SF_LLM_API_BASE: ${SF_LLM_API_BASE:-http://litellm:4000}
      SF_LLM_API_KEY: ${SF_LLM_API_KEY}
      SF_LLM_MODEL: ${SF_LLM_MODEL:-gpt-4o-mini}
      # Hardcoded, no unsafe fallback (1.6.0) - matches
      # stack-spiderfoot-podman.yml. Upstream defaults SF_QDRANT_BACKEND to
      # "memory" (ephemeral, always empty) unless explicitly overridden -
      # a ${VAR:-memory}/${VAR:-mock} fallback here is one missing env-file
      # line away from silently reproducing that exact bug. Qdrant host/
      # port/prefix stay env-configurable - only the values with
      # unsafe-default history are pinned.
      SF_QDRANT_BACKEND: http
      SF_QDRANT_HOST: "${SF_QDRANT_HOST:-qdrant}"
      SF_QDRANT_PORT: "${SF_QDRANT_PORT:-6333}"
      SF_QDRANT_GRPC_PORT: "${SF_QDRANT_GRPC_PORT:-6334}"
      SF_QDRANT_PREFIX: "${SF_QDRANT_PREFIX:-sf_}"
      # fastembed (onnxruntime-backed, CPU, all-MiniLM-L6-v2/384-dim) - no
      # external API key needed. The previous fallback default here
      # (text-embedding-3-small @ 1536-dim) contradicted this exact
      # comment and matched neither this stack's actual embedding backend
      # nor podman's.
      SF_EMBEDDING_PROVIDER: fastembed
      SF_EMBEDDING_MODEL: all-MiniLM-L6-v2
      SF_EMBEDDING_DIMENSIONS: 384
      SF_EMBEDDING_API_KEY: ${SF_LLM_API_KEY}
      SF_EMBEDDING_API_BASE: ${SF_EMBEDDING_API_BASE:-http://litellm:4000}
      # Added 2026-09-17: was unset everywhere (this file,
      # stack-spiderfoot-podman.yml, both env-examples) - see
      # stack-spiderfoot-podman.yml's identical addition for why.
      SF_REPORT_MAX_EVENTS_PER_SCAN: ${SF_REPORT_MAX_EVENTS_PER_SCAN:-2000}
      SF_RERANKER_PROVIDER: ${SF_RERANKER_PROVIDER:-litellm}
      SF_RERANKER_MODEL: ${SF_RERANKER_MODEL:-gpt-4o-mini}
      SF_RERANKER_API_KEY: ${SF_LLM_API_KEY}
      SF_RERANKER_API_BASE: ${SF_RERANKER_API_BASE:-http://litellm:4000}
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    command: ["python", "-m", "spiderfoot.agents.service"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      litellm:
        condition: service_started
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${AGENTS_CPUS:-2.0}"
          memory: "${AGENTS_MEMORY:-2G}"

networks:
  spiderfoot-docker-net:
    name: spiderfoot-docker-net
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  qdrant-data:
  embeddings-cache:
