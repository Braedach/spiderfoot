# =============================================================================
# LiteLLM proxy config - spiderfoot deployment
# Version: 1.0.0
# Created: 2026-08-06
# Updated: 2026-08-24
#
# Fronts Anthropic Claude Sonnet 5 for spiderfoot's AI report generation -
# matches the pattern Pulse monitoring and n8n already use on baden, not a
# local Ollama instance. Two aliases route to the same backend:
# spiderfoot-llm covers most agents; gemma3-27b is what report_generator
# specifically requests (its own hardcoded model choice in source, never
# actually pulled/configured) - aliased here rather than chased upstream.
#
# ANTHROPIC_API_KEY is read from the environment at runtime (os.environ/
# syntax, LiteLLM's own convention) - never written here as a literal
# value. Added as its own Portainer environment variable at deploy time.
#
# drop_params: some Claude models reject sampling params they don't
# support (Opus 5 only accepted temperature=1) rather than silently
# ignoring them - spiderfoot's agents send temperature=0.3, a normal
# default for most models. Kept as cheap insurance after switching to
# Sonnet 5, even though Sonnet 5 itself hasn't shown this behaviour.
# =============================================================================

model_list:
  - model_name: spiderfoot-llm
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: gemma3-27b
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  drop_params: True