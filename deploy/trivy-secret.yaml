# deploy/trivy-secret.yaml - allowlist for scan-gate.sh's secret scan.
#
# Trivy's secret scanner reports 39 "secrets" in the active-scanner image
# (22 private keys, 14 JWTs, 2 default-secret templates, 1 service-account
# pattern). Every one is inside /tools/nuclei-templates/: that repository is a
# collection of exploit PROOFS OF CONCEPT, and many ship the sample keys and
# tokens the vulnerable product itself ships (e.g. cve-2023-34039-keys/
# id_rsa_vnera_keypair_6.0.0_platform). They are public research fixtures, not
# credentials of ours. Verified 2026-10-23 by listing rule id and path only.
#
# The allowlist is by PATH, deliberately narrow: a real secret anywhere else in
# the image still fails the gate.
allow-rules:
  - id: nuclei-template-fixtures
    description: Public exploit proof-of-concept fixtures shipped inside the nuclei-templates repository
    path: ^tools/nuclei-templates/
  - id: anthropic-sdk-managed-agents-docstring
    description: >-
      False positive, not a secret: the anthropic Python SDK's Managed
      Agents feature (execution_identity parameter) repeats the same
      docstring - a redacted placeholder value `{*************************}`
      shown as an example of what NOT to send - across many files
      (resources/beta/agents/agents.py, types/beta/agent_*_params.py,
      types/beta/beta_managed_agents_*.py, types/beta/sessions/*.py, plus
      their .pyc companions). Trivy's "Google (GCP) Service-account"
      secret rule pattern-matches the brace/asterisk shape. Confirmed by
      reading the source at the flagged lines/offsets across every hit -
      plain prose, no credential, same string repeated verbatim.
      Introduced into the build when the dependabot pin-bump PR
      (fix/dependabot-open-alerts) moved anthropic 1.13.0 -> 1.17.0.
      Scoped to the whole anthropic package (not narrower) deliberately:
      enumerating individual files breaks again on the next SDK bump that
      touches a new file with the same shared docstring, and this is a
      single-source, hash-pinned PyPI package (requirements.lock), not
      arbitrary third-party content - same reasoning as the
      nuclei-template-fixtures rule above, applied to a different kind
      of vetted bulk content.
    path: ^opt/venv/lib/python3\.12/site-packages/anthropic/
