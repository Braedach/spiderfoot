# deploy/trivy-secret.yaml - allowlist for scan-gate.sh's secret scan.
#
# Trivy's secret scanner reports 39 "secrets" in the active-scanner image
# (22 private keys, 14 JWTs, 2 default-secret templates, 1 service-account
# pattern). Every one is inside /tools/nuclei-templates/: that repository is a
# collection of exploit PROOFS OF CONCEPT, and many ship the sample keys and
# tokens the vulnerable product itself ships (e.g. cve-2023-34039-keys/
# id_rsa_vnera_keypair_6.0.0_platform). They are public research fixtures, not
# credentials of ours. Verified 2026-10-23 by listing rule id and path only.
#
# The allowlist is by PATH, deliberately narrow: a real secret anywhere else in
# the image still fails the gate.
allow-rules:
  - id: nuclei-template-fixtures
    description: Public exploit proof-of-concept fixtures shipped inside the nuclei-templates repository
    path: ^tools/nuclei-templates/
