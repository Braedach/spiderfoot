# =============================================================================
# deploy/stack-podman.yml  (was stack-spiderfoot-podman.yml in the repo root until 2.8.0)
# Version: 2.10.0
# Created: 2026-08-06
# Updated: 2026-10-23
#
# Summary:
#   Purpose:
#     Self-hosted OSINT correlation platform (poppopjmp/spiderfoot v6.1.0, microservices fork).
#     Standalone manual investigation dashboard - separate from the osint stack's n8n automation pipeline.
#     This is the Podman PRODUCTION deployment (baden). The development/sandbox
#     deployment on claude is deploy/stack-docker.yml. Only ever PULLS the
#     images deploy/publish.sh builds and pushes - it never builds anything.
#     See deploy/README.md for the build -> test -> release flow.
#
#     AI report generation (sf-agents) calls Anthropic's API (Claude Sonnet 5) directly through the official SDK.
#     No proxy and no local Ollama. Needs ANTHROPIC_API_KEY.
#     Single network for isolation
#
#     110 of SpiderFoot's 310 modules need an API key; 80 of those are free (sign up, generate a key)
#     Highest-value free ones:
#        - Shodan, VirusTotal, AlienVault OTX, Censys, BinaryEdge, Hunter.io, AbuseIPDB, IPInfo.io, WhoisXML API, CertSpotter, FullHunt.
#     Full list: docs/free-api-modules.md
#
#  Functionality:
#     - New - The answer is no till I fix what was intended from the fork
#     - Get that going and working as intended - then I will think about it.  Would like to add SmartAI functionality but lets see.
#
#  GPU Passthrough:
#     - This is your fault
#     - current implementation uses torch which is massive and unwieldy
#     - torch takes the results of the scan and reduced the calls to the AI decreasing time and cost
#     - Get rid of the current solution and make it better and smaller.
#
#   Builds
#     - 6.1.0-g4b0231b2 is NOT good - do not use. Real Postgres connection-leak bug in ReportStore's read-only methods (get/list_reports/count never
#       committed, leaving transactions open indefinitely) - causes AI report generation to appear to hang/spin after a few uses, once enough stuck
#       connections pile up blocking the reports table. See Changelog 2.4.0.
#     - 6.1.0-gb05e98c3 is NOT good - do not use. Despite its own changelog entry (2.4.0) claiming otherwise, the fix above never
#       actually shipped in code - only in docs. See Changelog 2.6.0 for the full correction.
#     - 6.1.0-g95d573f9 was the last known-good build under the OLD tagging scheme (2026-09-22) - the ReportStore fix genuinely
#       applied this time, plus the same missing-commit pattern fixed across 17 more spiderfoot/db/ methods. Verified live on
#       baden via direct stress-test. See Changelog 2.6.0.
#     - TAGGING CHANGED in 2.8.0. The <VERSION>-g<sha> scheme is retired. Images are now tagged by deploy/publish.sh as
#       v<upstream base>-bd.<N> (release) or v<upstream base>-bd.<N>-rc.<M> (test build), e.g. v6.1.0-bd.1. An -rc tag never
#       moves :latest. SPIDERFOOT_TAG is REQUIRED and has no default: pin production to an exact release tag. No v*-bd.*
#       build has been verified known-good yet - record the first one here once it has soaked on claude and then baden.
#     - Remove other builds prior to starting major modifications
#
#   Usage:
#     UI at http://localhost:5001
#     Reverse proxy will require configuration along with appropriate CNAMES
#
#     FULL DEPLOYMENT SEQUENCE, from nothing, on baden:
#       1. Generate the runtime secrets (one time only, ever), on the host that runs the stack:
#             - ./deploy/bootstrap-spiderfoot-env.sh
#             - This writes /srv/spiderfoot/stack-spiderfoot-env.env (chmod 600) and prints the secrets ONCE.
#               Then set SPIDERFOOT_TAG and ANTHROPIC_API_KEY in it by hand (it writes them blank / CHANGE_ME).
#             - Re-running it is always safe and never rotates anything. If the secrets are lost later, read the file:
#               cat /srv/spiderfoot/stack-spiderfoot-env.env
#       2. Create the data directories:
#             - mkdir -p /srv/spiderfoot/{postgres,redis,qdrant,embeddings-cache}
#          Dockhand deploys with Docker Compose, which silently drops Podman-only volume flags (":U" etc.), so ownership is
#          NOT applied automatically: set it on the host (postgres data dir owned by uid 70, the postgres:alpine user).
#       3. In Dockhand, create the stack on the baden environment:
#          - Paste or sync this file
#          - Supply the values from /srv/spiderfoot/stack-spiderfoot-env.env as the stack's environment, and set
#            SPIDERFOOT_TAG to an exact published tag (see Builds above). The stack refuses to start without it.
#          - Deploy
#       4. Confirm all 7 containers report healthy (8 with the `scan` profile), then log in at the UI above with the admin password from step 1.
#
#       5. To upgrade: change SPIDERFOOT_TAG to the new exact tag and redeploy. Updates are deliberate, never automatic
#          (Watchtower was purged 30 Sep 2026).
#
#   Prerequisites:
#    - CNAME entries appropriate for you deployment
#    - Working Podman managed LXC Debian
#    - Reverse proxy system - network modification may be required due to your network structure
#    - The tag you deploy has been published by deploy/publish.sh (see deploy/README.md)
#
#   Warnings:
#     - BREAKING CHANGE (2.3.0, 2026-09-16): sf-qdrant jumped v1.12.4 -> v1.19.1, a 7-minor-version bump.
#       Qdrant's own upgrade docs are explicit that a single-node deployment cannot skip minor versions with
#       existing data on disk. Confirmed the hard way here: bumping the tag and restarting in place crash-looped
#       immediately (RocksDB->Gridstore storage format incompatibility). Safe fix, NOT a generic answer to every
#       Qdrant upgrade - only correct because nothing this stack stores in Qdrant is anything other than a
#       reconstructable derivative of Postgres scan data (confirmed by tracing every write path into it fork-wide,
#       2026-09-16 - see PR history). Stop the container and wipe its volume entirely, then restart clean:
#           - podman stop sf-qdrant
#           - rm -rf /srv/spiderfoot/qdrant/collections /srv/spiderfoot/qdrant/aliases /srv/spiderfoot/qdrant/.deleted /srv/spiderfoot/qdrant/raft_state.json
#           - podman start sf-qdrant
#       Tested live on baden.
#     - BREAKING CHANGE (2.1.0, 2026-09-12): image tags 6.1.0-g529d9da2 and later have NO torch/sentence-transformers anywhere 
#       SF_EMBEDDING_PROVIDER=sentence_transformer silently degrades to mock (fake) embeddings on those tags, not an error. 
#       This file already runs fastembed - see Changelog 2.1.0.
#     - depends_on is start-order only, not health-gated - deliberate.
#     - read_only + tmpfs mode=1777 on the api/worker containers and nginx's tmpfs + cap_add [CHOWN, SETGID, SETUID] on the frontend were both found the hard way.
#     - Runs 300+ modules incl. 33+ active recon tools (scan profile) that make outbound requests to third parties during scans
#     - only scan targets you are authorised to investigate
#     - IDS/IPS systems may go ballistic
#
# Changelog:
#   2.10.0 (2026-10-24) - sf-litellm removed. Its only job was relaying sf-agents' chat calls to Anthropic; sf-agents now calls Claude
#     directly (SF_LLM_PROVIDER=anthropic, SF_LLM_MODEL=claude-sonnet-5-5, ANTHROPIC_API_KEY now required there). The old service ran
#     ghcr.io/berriai/litellm:main-latest, a floating tag, which is the wrong way to run a package that has had a supply-chain breach.
#     /srv/spiderfoot/litellm and the database named litellm, if any, can be deleted after the cutover (kept as the rollback).
#   2.9.0 (2026-10-23) - sf-celery-worker-active: tmpfs over /home/spiderfoot/.config, .cache and .pdcp (mode 1777). The active-scanner
#     image now sets HOME=/home/spiderfoot (uid 1000 has no passwd entry, so HOME was "/", read-only). katana, nuclei and the other
#     ProjectDiscovery tools write their config under $HOME at start-up and exit without scanning if they cannot. Found by running
#     every tool module against the image with this stack's exact container settings.
#     - Same worker: cap_add NET_RAW, no-new-privileges OFF, NMAP_PRIVILEGED=1. nmap, naabu, masscan and massdns could not start at all
#       (file capabilities beyond the dropped set -> exit 126); the image now grants cap_net_raw only. See the comment on the service.
#   2.8.0 (2026-10-23) - Brought into line with the ARTEX fork pattern (Design-Reference s24.3). Moved from the repo root into
#     deploy/ (stack-spiderfoot-podman.yml -> deploy/stack-podman.yml) so upstream merges never touch it.
#     - Images are now built and pushed by deploy/publish.sh on davros, not by GitHub Actions or the old untracked
#       /root/build-spiderfoot.sh. Flat names ghcr.io/braedach/spiderfoot-<service> are the single supported path.
#     - New fork tag scheme v<base>-bd.<N>[-rc.<M>]; -rc builds never move :latest. SPIDERFOOT_TAG is now REQUIRED
#       (${SPIDERFOOT_TAG:?...}) with no default, so nothing can drift silently and a test build cannot reach this stack.
#     - Removed stale references: Portainer (retired 2 Oct 2026, replaced by Dockhand), Watchtower labels on 5 services
#       (purged 30 Sep 2026; updates are deliberate), Pulse (dropped), and the ineffective ":U" mount flags (Dockhand's
#       Compose drops them; ownership is set on the host - see Usage step 2).
#     - bootstrap-spiderfoot-env.sh recovered from Braedach/Code's history (deleted in 18922aa, 2026-09-22) into
#       deploy/ as v1.2.0; it had been referenced here but existed nowhere. See the script's own changelog.
#     - litellm-config-podman.yaml and the near-identical Docker litellm-config.yaml merged into one deploy/litellm-config.yaml
#       shared with stack-docker.yml. Re-copy it to /srv/spiderfoot/litellm/config.yaml if you want the new comments; the
#       effective config is unchanged.
#     - Corrected the 2.7.0 entry (see below).
#   2.7.1 (2026-10-23)
#     - Fixed the redis image and associated issues   
#   2.7.0 (2026-09-24) - Image paths changed from ghcr.io/braedach/spiderfoot/spiderfoot-<service> (repo-scoped, as published by the old
#     davros script since its 3.3.0) to the flat ghcr.io/braedach/spiderfoot-<service>, because that is what GitHub Actions had begun
#     publishing. Corrected in 2.8.0: an earlier version of this entry claimed the old paths "never matched what actually gets
#     published" and that every pull would have 404'd. That was wrong - the old script published to the repo-scoped path
#     deliberately. The flat path is only right because 2.8.0 makes it the single supported path (deploy/publish.sh).
#     Also moved SPIDERFOOT_TAG to :latest on the assumption Watchtower would follow it - superseded by 2.8.0.
#   2.6.0 (2026-09-22) 
#     - New known-good build: 6.1.0-g95d573f9.
#     - 6.1.0-gb05e98c3 (2.4.0's known-good build) was never actually good - the ReportStore connection-leak fix it claimed never shipped in code,
#       only in docs/changelog (a PR built fresh off master instead of merging the real development-branch commit). Recurred live 2026-09-22:
#       list_reports(scan_id=...) held a transaction open 2h13m, five subsequent connections piled up behind it, took the API down. Fixed for real this time (6.1.0-g4899644a) 
#     - verified via the actual  committed diff and by grepping the file inside the built image, not by trusting the log. While verifying it live, found the identical
#       missing-commit pattern in 17 more spiderfoot/db/ methods backing
#     - See PR #393 and README.md's "Known good build" section for the full incident writeup.
#   2.5.0 (2026-09-18) 
#     - Two real scan-engine bugs found and fixed, not a new known-good build (still 6.1.0-gb05e98c3 below - not bumping that yet,
#       giving it more soak time). Both confirmed live on this deployment, image tag 6.1.0-gfeede62f:
#     - The frontend's scan-summary "modules running" count had been hardcoded to always show 0 since its own field never existed
#       anywhere in the progress pipeline (ProgressSnapshot, the Redis progress hash, the SSE/REST endpoints). Wired it through end to
#       end from an in-process registry the scan engine's own threadsFinished() poll already recomputes internally.
#     - That alone wasn't enough: SpiderFootPlugin.running (what the fix above actually reads) checks sharedThreadPool task state, but
#       SpiderFootModernPlugin.threadWorker() - used directly or via SpiderFootAsyncPlugin by every module in the codebase (310/310) -
#       overrides threadWorker() to call handleEvent() directly on the module's own thread, never touching sharedThreadPool at all. So
#       "running" was blind to real module activity regardless of the first fix. Not just cosmetic: threadsFinished() also drives
#       waitForThreads()'s decision that the scan itself is finished, so a scan could plausibly be marked complete while a slow module (e.g.
#       sfp_accounts checking hundreds of sites for one event) is still genuinely inside handleEvent(). Fixed with a _busy flag set/cleared
#       around that call, ORed with the legacy check. See PR #393. Verified live: correlated the counter second-by-second against
#       real sfp_accounts HTTP activity in celery-worker-active's logs -12 modules running at scan start, settling to 1 as only the slow
#       ones remain, tracking real engine state throughout.
#   2.4.0 (2026-09-17) 
#     - New known-good build: 6.1.0-gb05e98c3.
#       6.1.0-g4b0231b2 (2.2.0's known-good build) has a real bug: 
#       ReportStore's read-only methods (get, list_reports, count in spiderfoot/reporting/report_storage.py) never called conn.commit() or
#       rollback() after a SELECT. Since that connection is explicitly non-autocommit, every plain read left its transaction open
#       indefinitely - confirmed live: a single stuck read held a lock for 9+ minutes, blocking every later attempt to touch the reports table
#       (including the schema-check any fresh ReportStore init runs), and kept recurring within minutes of manually clearing it. From the frontend
#       this looked exactly like AI report generation "just spinning" - the report itself, and the LLM call, had already completed successfully;
#       an unrelated stuck read was blocking everything downstream of it.
#       Also added SF_REPORT_MAX_EVENTS_PER_SCAN=2000 to sf-agents - the configurable cap added for the same reason (see 2.2.0's changelog
#       entry, and PR #393) was never actually set anywhere, so it kept silently defaulting back to 500 regardless.
#   2.3.0 (2026-09-16) 
#     - BREAKING CHANGE: sf-qdrant v1.12.4 -> v1.19.1.
#       Verified via Qdrant's own upgrade documentation that a single-node deployment cannot skip minor versions with existing data on disk -
#       On that basis, fixed by stopping sf-qdrant, wiping /srv/spiderfoot/qdrant entirely, and starting clean on v1.19.1
#   2.2.0 (2026-09-13) 
#     - New known-good build: 6.1.0-g4b0231b2. Superseded by 2.4.0 below - this build has a real Postgres connection-leak bug, see that entry.
#       Fixed on the fork side and verified live on this deployment: AI reports generated via sf-agents' /report endpoint (the only path the
#       frontend actually calls) were never persisted server-side - only ever reached the requesting browser's own localStorage, invisible
#       from any other browser/device, no server-side audit trail. Now persisted via the same Postgres-backed store the (separate, previously
#       UI-unused) sf-api report pipeline already had. Covers both scan-level and workspace-level reports; GUI delete added. See PR #393 and
#       the fork's README for full detail. Independently verified the same commit on the Docker side (stack-spiderfoot-docker.yml) the same day.
#   2.1.0 (2026-09-12) 
#     - BREAKING CHANGE
#     - sf-agents: SF_EMBEDDING_PROVIDER sentence_transformer -> fastembed.
#     - drop torch and everything associated with it and switch the sentence_transformer.
#     - Shrunk the size of of two images considerably as a result and performance via CPU still seems very good
#     - Oustanding work is to create a GPU enabled version.  Very low priority.
#   1.17.0 (2026-09-11)
#     - Reverted the real-time EventBus/Qdrant indexing deploy (1bead36e) after a scan looked stalled - turned out to be a bad baseline comparison on my part, not a confirmed bug, 
#       but reverted rather than trust something already under suspicion mid-incident. 
#       CPU-only torch fix kept. New known-good tag: 6.1.0-gf75ce847. See Builds note above.
#   1.16.0 (2026-09-11)
#     - Noted in Summary: CPU-only torch fix (fork requirements.txt) - images ~4.7GB smaller each, verified (see stack-spiderfoot-docker.yml's changelog for the fork-side commit)
#   1.15.0 (2026-09-11)
#     - Added SF_EVENTBUS_BACKEND/SF_EVENTBUS_REDIS_URL to sf-celery-worker, sf-celery-worker-active and sf-agents 
#     - wires the real-time EventIndexer(Qdrant), previously complete code that nothing ever started (report_generator.py's on-demand Postgres backfill stays as a safety net, not replaced)
#   1.14.0 (2026-09-10)
#     - sf-agents now runs as root (0:0) instead of 1000:1000 - the embeddings-cache bind mount's ":U" auto-chown flag wasn't actually being applied by this stack's compose engine (confirmed via podman inspect)
#     - leaving the model cache root-owned and unwritable by a non-root container. Contained via the existing cap_drop: ALL + no-new-privileges, so root here carries no elevated capabilities.
#     - Removed the ineffective ":U" suffix from the embeddings-cache mount
#   1.13.0 (2026-09-10)
#     - Summary now notes 110/310 modules need an API key, 80 free - see docs/free-api-modules.md
#   1.12.0 (2026-09-10)
#     - Added sf-qdrant (missing service - sf-agents had nothing to point at, so Qdrant silently ran on the empty ephemeral in-memory backend every restart, even after 1.11.0's healthcheck fix)
#     - Wired SF_QDRANT_BACKEND/HOST/PORT and SF_EMBEDDING_PROVIDER/MODEL/DIMENSIONS into sf-agents - embeddings were also defaulting to mock (fake) vectors with nothing set
#     - Added a persistent bind mount for sf-agents' embeddings model cache
#     - Added cap_drop: ALL to sf-litellm (tested first on the local stack - safe; read_only was tested too and breaks it silently, not applied)
#     - Updated mkdir instructions and container count (6 -> 9) for the new service
#   1.11.0 (2026-09-10)
#     - sf-litellm had no healthcheck at all - added one (see inline comment)
#     - Fixed sf-litellm's comment block, which had reverted to stale pre-1.7.0 text claiming it fronts Ollama - it fronts Anthropic, matching the Summary and its own env vars
#   1.10.0 (2026-09-10)
#     - All 5 spiderfoot-* image: paths updated to ghcr.io/braedach/spiderfoot/spiderfoot-<service>
#   Previous builds refer to github history
#
# =============================================================================

name: spiderfoot

services:
  sf-postgres:
    image: docker.io/library/postgres:15-alpine
    container_name: sf-postgres
    hostname: sf-postgres
    restart: always
    environment:
      - TZ=${TZ}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - /srv/spiderfoot/postgres:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - spiderfoot-net

  sf-redis:
    image: docker.io/library/redis:7-alpine
    container_name: sf-redis
    hostname: sf-redis
    restart: always
    environment:
      - TZ=${TZ}
    volumes:
      - /srv/spiderfoot/redis:/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - spiderfoot-net

  sf-api:
    image: ghcr.io/braedach/spiderfoot-api:${SPIDERFOOT_TAG:?set SPIDERFOOT_TAG to an exact published tag, e.g. v6.1.0-bd.1}
    container_name: sf-api
    hostname: sf-api
    restart: always
    user: "1000:1000"
    read_only: true
    labels:
      - com.docker.compose.project=spiderfoot
      - com.docker.compose.service=sf-api
    tmpfs:
      - /home/spiderfoot/cache:mode=1777
      - /home/spiderfoot/logs:mode=1777
      - /tmp
    environment:
      - TZ=${TZ}
      - SF_DEPLOYMENT_MODE=${SF_DEPLOYMENT_MODE}
      - SF_POSTGRES_DSN=${SF_DATABASE_URL}
      - SF_REDIS_URL=${SF_REDIS_URL}
      - SF_LOG_FORMAT=${SF_LOG_FORMAT}
      - SF_JWT_SECRET=${SF_JWT_SECRET_KEY}
      - SF_ADMIN_PASSWORD=${SF_ADMIN_PASSWORD}
    depends_on:
      - sf-postgres
      - sf-redis
    healthcheck:
      test: ["CMD", "python3", "-c", "__import__('urllib.request').request.urlopen('http://127.0.0.1:9001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      spiderfoot-net:
        aliases:
          - api

  sf-celery-worker:
    image: ghcr.io/braedach/spiderfoot-scanner:${SPIDERFOOT_TAG:?set SPIDERFOOT_TAG to an exact published tag, e.g. v6.1.0-bd.1}
    container_name: sf-celery-worker
    hostname: sf-celery-worker
    restart: always
    user: "1000:1000"
    read_only: true
    labels:
      - com.docker.compose.project=spiderfoot
      - com.docker.compose.service=sf-celery-worker
    tmpfs:
      - /home/spiderfoot/cache:mode=1777
      - /home/spiderfoot/logs:mode=1777
      - /tmp
    environment:
      - TZ=${TZ}
      - SF_DEPLOYMENT_MODE=${SF_DEPLOYMENT_MODE}
      - SF_POSTGRES_DSN=${SF_DATABASE_URL}
      - SF_REDIS_URL=${SF_REDIS_URL}
      - SF_LOG_FORMAT=${SF_LOG_FORMAT}
      # Real-time Qdrant indexing via EventBus - CURRENTLY INERT. The
      # scanner-side publish code (commit 1bead36e) was reverted on
      # 2026-09-11 after a scan looked stalled post-deploy; turned out to
      # be a bad baseline comparison, not a confirmed bug, but reverted
      # anyway rather than trust something already under suspicion
      # mid-incident. Nothing in the currently-deployed image reads these
      # two vars. Left in place, not removed, for whenever that feature
      # gets a clean, unhurried verification pass and goes back in - see
      # stack-spiderfoot-podman.yml's git history / PR #393 for the fix.
      - SF_EVENTBUS_BACKEND=redis
      - SF_EVENTBUS_REDIS_URL=${SF_REDIS_URL}
    depends_on:
      - sf-postgres
      - sf-redis
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - spiderfoot-net

  sf-celery-worker-active:
    image: ghcr.io/braedach/spiderfoot-active-scanner:${SPIDERFOOT_TAG:?set SPIDERFOOT_TAG to an exact published tag, e.g. v6.1.0-bd.1}
    container_name: sf-celery-worker-active
    hostname: sf-celery-worker-active
    restart: always
    profiles:
      - scan
    user: "1000:1000"
    read_only: true
    labels:
      - com.docker.compose.project=spiderfoot
      - com.docker.compose.service=sf-celery-worker-active
    tmpfs:
      - /home/spiderfoot/cache:mode=1777
      - /home/spiderfoot/logs:mode=1777
      - /home/spiderfoot/.config:mode=1777
      - /home/spiderfoot/.cache:mode=1777
      - /home/spiderfoot/.pdcp:mode=1777
      - /tmp
    environment:
      - TZ=${TZ}
      - SF_DEPLOYMENT_MODE=${SF_DEPLOYMENT_MODE}
      - SF_POSTGRES_DSN=${SF_DATABASE_URL}
      - SF_REDIS_URL=${SF_REDIS_URL}
      - SF_LOG_FORMAT=${SF_LOG_FORMAT}
      # Real-time Qdrant indexing via EventBus - CURRENTLY INERT, same as
      # sf-celery-worker above (reverted 2026-09-11, kept for later).
      - SF_EVENTBUS_BACKEND=redis
      - SF_EVENTBUS_REDIS_URL=${SF_REDIS_URL}
      - NMAP_PRIVILEGED=1
    depends_on:
      - sf-postgres
      - sf-redis
    # Raw-socket scanning (nmap -sS, naabu SYN, masscan) needs CAP_NET_RAW and nothing else. The
    # image gives those binaries cap_net_raw as a FILE capability, and the kernel ignores file
    # capabilities for a non-root process while no-new-privileges is set - so this one worker
    # runs with it off (verified: with it on, raw scans fail "Operation not permitted" even
    # with NET_RAW granted). Everything else stays dropped, the image has no setuid binaries,
    # and the root filesystem is read-only. The alternative that keeps no-new-privileges is
    # user "0:0" with cap_drop ALL + this cap_add; it was judged worse (uid 0 inside).
    # NMAP_PRIVILEGED tells nmap to trust that capability instead of demanding euid 0.
    security_opt:
      - no-new-privileges:false
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    networks:
      - spiderfoot-net

  sf-frontend-ui:
    image: ghcr.io/braedach/spiderfoot-frontend:${SPIDERFOOT_TAG:?set SPIDERFOOT_TAG to an exact published tag, e.g. v6.1.0-bd.1}
    container_name: sf-frontend-ui
    hostname: sf-frontend-ui
    restart: always
    read_only: true
    ports:
      - 5001:80
    labels:
      - com.docker.compose.project=spiderfoot
      - com.docker.compose.service=sf-frontend-ui
      - homepage.group=Open-Source Intelligence
      - homepage.name=SpiderFoot Service
      - homepage.href=https://spiderfoot.baden.braedach.com
      - homepage.description=Spiderfoot Intelligence Tool
      - homepage.icon=spiderfoot.png
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /var/run
    environment:
      - TZ=${TZ}
      - NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1
    depends_on:
      - sf-api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    networks:
      - spiderfoot-net

  sf-qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: sf-qdrant
    hostname: sf-qdrant
    restart: always
    environment:
      - TZ=${TZ}
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
    volumes:
      - /srv/spiderfoot/qdrant:/qdrant/storage
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      spiderfoot-net:
        aliases:
          - qdrant

  sf-agents:
    image: ghcr.io/braedach/spiderfoot-base:${SPIDERFOOT_TAG:?set SPIDERFOOT_TAG to an exact published tag, e.g. v6.1.0-bd.1}
    container_name: sf-agents
    hostname: sf-agents
    restart: always
    # Runs as root (0:0), unlike the other services - the embeddings-cache
    # bind mount below needs a writable owner and podman's ":U" auto-chown
    # bind option isn't actually being honored through this stack's compose
    # engine (confirmed: podman inspect showed a plain rbind, no chown
    # applied). Running as root sidesteps the UID-mismatch entirely without
    # a manual host-side chown on every fresh deploy. Contained by cap_drop:
    # ALL below - root here has no elevated Linux capabilities (no
    # CAP_DAC_OVERRIDE, CAP_SYS_ADMIN, etc.), so it's UID 0 in name only.
    user: "0:0"
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    command: ["python", "-m", "spiderfoot.agents.service"]
    devices:
      # Podman CDI - NVIDIA RTX 3070 passthrough (configured via
      # setup-lxc-gpu.sh). Needs read_only removed (see below) - the
      # nvidia-cdi-hook writes into the container's filesystem at startup
      # and fails outright if it can't.
      - nvidia.com/gpu=all
    labels:
      - com.docker.compose.project=spiderfoot
      - com.docker.compose.service=sf-agents
    tmpfs:
      - /home/spiderfoot/cache:mode=1777
      - /home/spiderfoot/logs:mode=1777
      - /home/spiderfoot/data:mode=1777
      - /home/spiderfoot/.spiderfoot:mode=1777
      - /tmp
    environment:
      - TZ=${TZ}
      - HF_HOME=/home/spiderfoot/.cache/huggingface
      - SF_SERVICE_ROLE=agents
      - SF_AGENTS_HOST=0.0.0.0
      - SF_AGENTS_PORT=8100
      - SF_POSTGRES_DSN=${SF_DATABASE_URL}
      - SF_REDIS_URL=${SF_REDIS_URL}
      # Claude is called directly through the official SDK (the LiteLLM proxy this replaced is gone).
      - SF_LLM_PROVIDER=anthropic
      - SF_LLM_MODEL=${SF_LLM_MODEL:-claude-sonnet-5-5}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY}
      - SF_QDRANT_BACKEND=http
      - SF_QDRANT_HOST=qdrant
      - SF_QDRANT_PORT=6333
      - SF_QDRANT_GRPC_PORT=6334
      - SF_QDRANT_PREFIX=sf_
      - SF_EMBEDDING_PROVIDER=fastembed
      - SF_EMBEDDING_MODEL=all-MiniLM-L6-v2
      - SF_EMBEDDING_DIMENSIONS=384
      # Added 2026-09-17: was unset everywhere (this file, stack-spiderfoot-
      # docker.yml, both env-examples), meaning report_generator.py's own
      # configurable-cap fix (see PR #393) had nothing to actually raise it
      # to - every report was still silently capped at the hardcoded-default
      # 500 events regardless. 2000 comfortably covers the 687-event scan
      # that originally exposed the cap.
      - SF_REPORT_MAX_EVENTS_PER_SCAN=${SF_REPORT_MAX_EVENTS_PER_SCAN:-2000}
      # Real-time Qdrant indexing via EventBus - CURRENTLY INERT, same as
      # sf-celery-worker above (reverted 2026-09-11, kept for later). This
      # is also where the indexer itself would run once re-enabled.
      - SF_EVENTBUS_BACKEND=redis
      - SF_EVENTBUS_REDIS_URL=${SF_REDIS_URL}
    volumes:
      - /srv/spiderfoot/embeddings-cache:/home/spiderfoot/.cache/huggingface
    depends_on:
      - sf-postgres
      - sf-redis
      - sf-qdrant
    healthcheck:
      test: ["CMD", "python3", "-c", "__import__('urllib.request').request.urlopen('http://127.0.0.1:8100/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - spiderfoot-net

networks:
  spiderfoot-net:
    name: spiderfoot-net
    driver: bridge
