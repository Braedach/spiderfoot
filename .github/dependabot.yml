version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 14
  - package-ecosystem: "pip"
    directory: "/test"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 14
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 14
